<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zedith — Sign In</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { sans:['Inter','system-ui','sans-serif'], display:['"Plus Jakarta Sans"','Inter','sans-serif'] },
    }
  }
}
</script>
<style>
:root{
  --zed:#18181b; --zed-solid:#27272a; --zed-solid-600:#000000; --zed-accent:#E8622C;
}
.dark{
  --zed:#f4f4f5; --zed-solid:#3f3f46; --zed-solid-600:#52525b; --zed-accent:#E8622C;
}
*{font-family:Inter,system-ui,sans-serif}
.display{font-family:"Plus Jakarta Sans",Inter,sans-serif}
</style>
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
</head>
<body class="bg-[#fbfaf7] dark:bg-[#1e1e1e] text-zinc-900 dark:text-zinc-100 min-h-screen flex items-center justify-center p-4 transition-colors">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto mb-4 flex items-center justify-center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="currentColor" class="text-zinc-900 dark:text-zinc-100" stroke-width="2.4" stroke-linecap="round">
            <path d="M7 12 L7 7.2"/><path d="M7 12 L11 9.6"/><path d="M7 12 L11 14.4"/><path d="M7 12 L7 16.8"/><path d="M7 12 L2.6 14.4"/>
          </g>
          <g stroke="#E8622C" stroke-width="2.4" stroke-linecap="round">
            <path d="M17 12 L17 7.2"/><path d="M17 12 L13 9.6"/><path d="M17 12 L13 14.4"/><path d="M17 12 L17 16.8"/><path d="M17 12 L21.4 14.4"/>
          </g>
        </svg>
      </div>
      <h1 class="display text-2xl font-[800]">Welcome to Zedith</h1>
      <p class="text-zinc-500 dark:text-zinc-400 text-sm mt-1">AI workspace for creators</p>
    </div>

    <div class="bg-white dark:bg-[#262626] border border-zinc-200 dark:border-[#3a3a3a] rounded-2xl p-6 shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
      <div class="flex bg-zinc-100 dark:bg-[#333] rounded-xl p-1 mb-5">
        <button id="tab-signup" class="flex-1 py-2 rounded-lg text-sm font-semibold transition">Sign Up</button>
        <button id="tab-login" class="flex-1 py-2 rounded-lg text-sm font-semibold transition">Log In</button>
      </div>

      <button id="google-btn" type="button" class="w-full flex items-center justify-center gap-3 py-[11px] rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-[#2c2c2c] hover:bg-zinc-50 dark:hover:bg-[#333] text-sm font-semibold transition mb-4">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47c-.28 1.5-1.13 2.78-2.4 3.63v3.02h3.88c2.27-2.09 3.57-5.17 3.57-8.84z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-3.02c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.95H1.27v3.11C3.25 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.27 14.28A7.19 7.19 0 0 1 4.9 12c0-.79.14-1.56.37-2.28V6.61H1.27A11.98 11.98 0 0 0 0 12c0 1.94.46 3.77 1.27 5.39l4-3.11z"/>
          <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.6 4.59 1.79l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.61l4 3.11C6.22 6.86 8.87 4.75 12 4.75z"/>
        </svg>
        Continue with Google
      </button>

      <div class="flex items-center gap-3 mb-4">
        <div class="flex-1 h-px bg-zinc-200 dark:bg-zinc-700"></div>
        <span class="text-[11px] text-zinc-400">or</span>
        <div class="flex-1 h-px bg-zinc-200 dark:bg-zinc-700"></div>
      </div>

      <form id="auth-form" class="space-y-4">
        <div id="name-field">
          <label class="text-xs text-zinc-500 dark:text-zinc-400 block mb-1">Display Name</label>
          <input id="name" type="text" placeholder="snakyboyYT" class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-[#2c2c2c] border border-zinc-200 dark:border-zinc-700 outline-none focus:border-[var(--zed-accent)] text-sm"/>
        </div>
        <div>
          <label class="text-xs text-zinc-500 dark:text-zinc-400 block mb-1">Email</label>
          <input id="email" type="email" placeholder="you@creator.com" required class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-[#2c2c2c] border border-zinc-200 dark:border-zinc-700 outline-none focus:border-[var(--zed-accent)] text-sm"/>
        </div>
        <div>
          <label class="text-xs text-zinc-500 dark:text-zinc-400 block mb-1">Password</label>
          <input id="password" type="password" placeholder="••••••••" required minlength="6" class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-[#2c2c2c] border border-zinc-200 dark:border-zinc-700 outline-none focus:border-[var(--zed-accent)] text-sm"/>
        </div>
        <button type="submit" id="submit-btn" class="w-full py-3 rounded-xl bg-[var(--zed-solid)] hover:bg-[var(--zed-solid-600)] text-white font-semibold text-sm transition">Continue</button>
      </form>

      <div id="message" class="mt-4 text-xs text-center hidden"></div>
    </div>

    <p class="text-center text-xs text-zinc-500 mt-6">
      By continuing, you agree to our Terms and Privacy Policy.
    </p>
  </div>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    const configRes = await fetch('/api/config');
    if(!configRes.ok){
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#71717a;font-size:13px;text-align:center;padding:20px;">Zedith couldn\'t start — please refresh the page. If this keeps happening, contact zedithsupport@gmail.com</div>';
      throw new Error('Failed to load app config from /api/config');
    }
    const {url: SUPABASE_URL, anonKey: SUPABASE_ANON} = await configRes.json();
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

    const params = new URLSearchParams(location.search);
    let mode = params.get('mode') || 'signup';
    const tabSignup = document.getElementById('tab-signup');
    const tabLogin = document.getElementById('tab-login');
    const nameField = document.getElementById('name-field');
    const submitBtn = document.getElementById('submit-btn');
    const googleBtn = document.getElementById('google-btn');
    const msg = document.getElementById('message');

    function setMode(m){
      mode = m;
      history.replaceState(null,'','?mode='+m);
      if(m==='signup'){
        tabSignup.className='flex-1 py-2 rounded-lg text-sm font-semibold transition bg-[var(--zed-solid)] text-white';
        tabLogin.className='flex-1 py-2 rounded-lg text-sm font-semibold transition text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white';
        nameField.style.display='block';
        submitBtn.textContent='Create account';
      } else {
        tabLogin.className='flex-1 py-2 rounded-lg text-sm font-semibold transition bg-[var(--zed-solid)] text-white';
        tabSignup.className='flex-1 py-2 rounded-lg text-sm font-semibold transition text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white';
        nameField.style.display='none';
        submitBtn.textContent='Log in';
      }
    }

    setMode(mode);
    tabSignup.onclick = ()=>setMode('signup');
    tabLogin.onclick = ()=>setMode('login');

    function showMessage(text, type='info'){
      msg.textContent = text;
      msg.className = 'mt-4 text-xs text-center ' + (type==='err'?'text-red-500':'text-emerald-500');
      msg.classList.remove('hidden');
    }

    googleBtn.onclick = async ()=>{
      googleBtn.disabled = true;
      try{
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: location.origin + '/index.html' }
        });
        if(error) throw error;
        // Browser redirects to Google here; no further code runs on success.
      }catch(err){
        console.error('Google sign-in error:', err);
        showMessage(err?.message || 'Could not start Google sign-in.', 'err');
        googleBtn.disabled = false;
      }
    };

    document.getElementById('auth-form').onsubmit = async (e)=>{
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Please wait…';
      try {
        if(mode==='signup'){
          const { data, error } = await supabase.auth.signUp({
            email, password,
            options: {
              data: { display_name: name || email.split('@')[0] },
              emailRedirectTo: location.origin + location.pathname.replace(/[^/]*$/, '') + 'index.html'
            }
          });
          if(error) throw error;
          if(data.session){
            // Supabase gave us a session immediately — email confirmation is
            // OFF in project settings, so the account is already usable.
            location.href = 'index.html';
          } else {
            showMessage('Check your email and click the verification link.', 'ok');
          }
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if(error) throw error;
          location.href = 'index.html';
        }
      } catch(err){
        console.error('Auth error object:', err);
        const message = (err && err.message) ? err.message : JSON.stringify(err);
        showMessage(message, 'err');
        submitBtn.disabled = false;
        submitBtn.textContent = mode==='signup'?'Create account':'Log in';
      }
    };

    // If already logged in, go to app
    const { data } = await supabase.auth.getSession();
    if(data.session) location.href = 'index.html';
  </script>
</body>
</html>
